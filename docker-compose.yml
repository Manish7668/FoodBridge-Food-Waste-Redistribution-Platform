services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongodb:27017/foodbridge
      JWT_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      CLIENT_URL: http://localhost:5173
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: [mongodb]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mongo_data:
